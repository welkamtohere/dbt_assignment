version: 2

# ---------------------------------------------------------------------
# MODELS — descriptions (feed the docs site) + generic tests
# ---------------------------------------------------------------------
models:
  - name: stg_customers
    description: "One cleaned row per customer, with a stitched full_name."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: first_name
        description: "The first name of the customer."
        data_tests: [not_null]
      - name: last_name
        description: "The last name of the customer."
        data_tests: [not_null]
      - name: full_name
        description: "The full name of the customer, stitched together from first_name and last_name"
        data_tests: [not_null]
      - name: email
        description: "The email address of the customer."
        data_tests: [not_null]
      - name: is_active
        description: "Whether the customer is active or not."
        data_tests: [not_null]
      - name: create_date
        description: "When the customer was created."
        data_tests: [not_null]
      - name: last_update
        description: "When the customer was last updated."
        data_tests: [not_null]
